name : CI pipeline
on:
  push:
    branches:
      - docker_CI
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: MVN test
        run: mvn test
      - name: MVN Clean
        run:  mvn clean
      - name: MVN package
        run: mvn package
     
            

